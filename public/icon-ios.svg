<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners for iOS -->
  <rect width="512" height="512" rx="115" fill="#000000"/>

  <!-- Scale and center the logo content (100x100 viewport scaled to fit 412x412 with padding) -->
  <g transform="translate(50, 50) scale(4.12)">
    <!-- QR Code Corner Markers -->
    <g>
      <!-- Top Left -->
      <rect x="12" y="12" width="24" height="24" fill="white"/>
      <rect x="16" y="16" width="16" height="16" fill="black"/>
      <rect x="20" y="20" width="8" height="8" fill="white"/>

      <!-- Top Right -->
      <rect x="64" y="12" width="24" height="24" fill="white"/>
      <rect x="68" y="16" width="16" height="16" fill="black"/>
      <rect x="72" y="20" width="8" height="8" fill="white"/>

      <!-- Bottom Left -->
      <rect x="12" y="64" width="24" height="24" fill="white"/>
      <rect x="16" y="68" width="16" height="16" fill="black"/>
      <rect x="20" y="72" width="8" height="8" fill="white"/>
    </g>

    <!-- QR Code Data Dots -->
    <g>
      <rect x="42" y="16" width="4" height="4" fill="white"/>
      <rect x="48" y="16" width="4" height="4" fill="white"/>
      <rect x="54" y="16" width="4" height="4" fill="white"/>
      <rect x="42" y="22" width="4" height="4" fill="white"/>
      <rect x="54" y="22" width="4" height="4" fill="white"/>
      <rect x="42" y="28" width="4" height="4" fill="white"/>
      <rect x="16" y="42" width="4" height="4" fill="white"/>
      <rect x="22" y="42" width="4" height="4" fill="white"/>
      <rect x="16" y="48" width="4" height="4" fill="white"/>
      <rect x="22" y="54" width="4" height="4" fill="white"/>
      <rect x="64" y="42" width="4" height="4" fill="white"/>
      <rect x="70" y="48" width="4" height="4" fill="white"/>
      <rect x="76" y="54" width="4" height="4" fill="white"/>
    </g>

    <!-- Lock Icon in Center -->
    <g transform="translate(50, 52)">
      <!-- Lock Shackle -->
      <path
        d="M -9 -5 L -9 -11 C -9 -15 -6 -18 -2 -18 L 2 -18 C 6 -18 9 -15 9 -11 L 9 -5"
        stroke="white"
        strokeWidth="3"
        fill="none"
        strokeLinecap="round"
      />

      <!-- Lock Body -->
      <rect
        x="-12"
        y="-5"
        width="24"
        height="18"
        rx="3"
        fill="white"
      />

      <!-- Keyhole -->
      <circle
        cx="0"
        cy="2"
        r="3"
        fill="black"
      />
      <rect
        x="-1.5"
        y="2"
        width="3"
        height="5"
        rx="1.5"
        fill="black"
      />
    </g>
  </g>
</svg>
