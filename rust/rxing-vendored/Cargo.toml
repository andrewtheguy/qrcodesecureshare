[package]
name = "rxing"
version = "0.0.1"
description = "Trimmed QR reading-only fork of rxing v0.9.0, vendored for rust/rxing-wasm."
license = "Apache-2.0"
edition = "2024"

[dependencies]
regex = "1.12"
once_cell = "1.21"
encoding_rs = "0.8"
codepage-437 = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
multimap = "0.10"
num = "0.4"
thiserror = "2.0"
unicode-segmentation = "1.12"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
