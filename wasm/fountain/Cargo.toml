# The page's LT fountain encoder and decoder, and the CRC32 the transfer checks
# parts with, as a WebAssembly module of its own.
#
# Built by `bun run build:wasm` at the repo root, into pkg/, which the app
# imports by path (src/utils/fountainCodeWasm.ts). It builds for
# `wasm32-unknown-unknown` alone, with the profile, the lockfile and the
# toolchain here.
[package]
name = "fountain-wasm"
version = "0.0.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
crc32fast = "1.4"

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
